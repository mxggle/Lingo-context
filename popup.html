<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LingoContext Settings</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #18181b;
      color: #e4e4e7;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 16px 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }

    .logo {
      width: 36px;
      height: 36px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .header-text h1 {
      font-size: 15px;
      font-weight: 700;
      color: #fafafa;
      line-height: 1.2;
    }

    .header-text p {
      font-size: 11px;
      color: #71717a;
      margin-top: 1px;
    }

    /* Status pill in header */
    .status-pill {
      margin-left: auto;
      display: flex;
      align-items: center;
      gap: 5px;
      padding: 4px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(34, 197, 94, 0.12);
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.2);
      transition: all 0.2s;
      flex-shrink: 0;
    }

    .status-pill.inactive {
      background: rgba(113, 113, 122, 0.12);
      color: #71717a;
      border-color: rgba(113, 113, 122, 0.2);
    }

    .status-pill .dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
    }

    /* ── Main content ── */
    .content {
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Card ── */
    .card {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      overflow: hidden;
    }

    /* ── User card ── */
    .user-card {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 13px;
    }

    .user-avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    #userAvatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      object-fit: cover;
      display: block;
      border: 1.5px solid rgba(251, 191, 36, 0.3);
    }

    .avatar-placeholder {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: linear-gradient(135deg, #fbbf24, #f59e0b);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      font-weight: 700;
      color: #1c1917;
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    #userName {
      font-size: 13px;
      font-weight: 600;
      color: #fafafa;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    #userEmail {
      font-size: 11px;
      color: #71717a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 1px;
    }

    .logout-btn {
      flex-shrink: 0;
      background: none;
      border: none;
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      color: #71717a;
      display: flex;
      align-items: center;
      transition: background 0.15s, color 0.15s;
    }

    .logout-btn:hover {
      background: rgba(248, 113, 113, 0.12);
      color: #f87171;
    }

    /* ── Login button ── */
    #loginBtn {
      width: 100%;
      padding: 11px 14px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 12px;
      color: #e4e4e7;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      transition: background 0.15s, border-color 0.15s;
    }

    #loginBtn:hover {
      background: rgba(255, 255, 255, 0.08);
      border-color: rgba(255, 255, 255, 0.14);
    }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 11px 13px;
    }

    .toggle-row-label {
      font-size: 13px;
      color: #d4d4d8;
    }

    .toggle {
      position: relative;
      width: 40px;
      height: 22px;
      flex-shrink: 0;
    }

    .toggle input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .toggle-slider {
      position: absolute;
      cursor: pointer;
      inset: 0;
      background: #3f3f46;
      border-radius: 22px;
      transition: background 0.2s;
    }

    .toggle-slider:before {
      content: "";
      position: absolute;
      height: 16px;
      width: 16px;
      left: 3px;
      top: 3px;
      background: #fafafa;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .toggle input:checked + .toggle-slider {
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
    }

    .toggle input:checked + .toggle-slider:before {
      transform: translateX(18px);
      background: #1c1917;
    }

    @keyframes toggleSaved {
      0%, 100% { background: rgba(255,255,255,0.04); border-color: rgba(255,255,255,0.07); }
      40%       { background: rgba(34,197,94,0.1);   border-color: rgba(34,197,94,0.25); }
    }

    .card.saved { animation: toggleSaved 1.2s ease forwards; }

    /* ── Dashboard button ── */
    #dashboardBtn {
      width: 100%;
      padding: 11px 14px;
      background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
      border: none;
      border-radius: 12px;
      color: #1c1917;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      transition: filter 0.15s, transform 0.15s;
      letter-spacing: 0.01em;
    }

    #dashboardBtn:hover {
      filter: brightness(1.08);
      transform: translateY(-1px);
    }

    #dashboardBtn:active {
      transform: translateY(0);
    }

    /* ── Footer ── */
    footer {
      padding: 10px 14px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .footer-links {
      display: flex;
      gap: 12px;
    }

    footer a {
      font-size: 11px;
      color: #52525b;
      text-decoration: none;
      transition: color 0.15s;
    }

    footer a:hover {
      color: #fbbf24;
    }

    #versionDisplay {
      font-size: 11px;
      color: #3f3f46;
    }

    /* ── Toast ── */
    .toast {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s, transform 0.2s;
      white-space: nowrap;
      background: rgba(34, 197, 94, 0.15);
      border: 1px solid rgba(34, 197, 94, 0.3);
      color: #4ade80;
    }

    .toast.error {
      background: rgba(248, 113, 113, 0.15);
      border-color: rgba(248, 113, 113, 0.3);
      color: #f87171;
    }

    .toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    /* ── Auth area ── */
    /* Hidden until JS resolves the auth state — prevents login→user flash */
    #authArea {
      opacity: 0;
      transition: opacity 0.15s ease;
    }
    #authArea.auth-ready {
      opacity: 1;
    }

    /* Auth view helpers (for transitions after init) */
    .auth-view { transition: opacity 0.15s ease; }
    .auth-view.hidden-auth { opacity: 0; pointer-events: none; }
  </style>
</head>

<body>

  <!-- Header -->
  <header class="header">
    <img src="icons/icon128.png" class="logo" alt="LingoContext">
    <div class="header-text">
      <h1>LingoContext</h1>
      <p data-i18n="popupSubtitle">Language Learning Assistant</p>
    </div>
    <div class="status-pill inactive" id="statusPill">
      <span class="dot"></span>
      <span id="statusPillLabel">Off</span>
    </div>
  </header>

  <!-- Content -->
  <div class="content">

    <!-- Auth area: hidden until JS resolves state, preventing flash -->
    <div id="authArea">

    <!-- Login (logged-out state) -->
    <div id="authSection" class="auth-view">
      <button id="loginBtn">
        <svg width="16" height="16" viewBox="0 0 18 18">
          <path d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844a4.14 4.14 0 0 1-1.796 2.716v2.259h2.908c1.702-1.567 2.684-3.875 2.684-6.615z" fill="#4285F4"/>
          <path d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.715H.957v2.332A8.997 8.997 0 0 0 9 18z" fill="#34A853"/>
          <path d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z" fill="#FBBC05"/>
          <path d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z" fill="#EA4335"/>
        </svg>
        <span data-i18n="loginGoogle">Continue with Google</span>
      </button>
    </div>

    <!-- User card (logged-in state) -->
    <div id="userInfo" class="auth-view hidden-auth card" style="display: none;">
      <div class="user-card">
        <div class="user-avatar-wrap">
          <img id="userAvatar" src="" alt="" style="display: none;">
          <div class="avatar-placeholder" id="avatarPlaceholder">?</div>
        </div>
        <div class="user-meta">
          <div id="userName"></div>
          <div id="userEmail"></div>
        </div>
        <!-- Logout icon button -->
        <button class="logout-btn" id="logoutBtn" title="Sign out">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
        </button>
      </div>
    </div>

    </div> <!-- /#authArea -->

    <!-- Enable extension toggle -->
    <div class="card" id="toggleCard">
      <div class="toggle-row">
        <span class="toggle-row-label" data-i18n="enableExtension">Enable Extension</span>
        <label class="toggle">
          <input type="checkbox" id="enabled" checked>
          <span class="toggle-slider"></span>
        </label>
      </div>
    </div>

    <!-- Dashboard CTA -->
    <button id="dashboardBtn" data-i18n="openDashboardBtn">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      Open Dashboard
    </button>

  </div>

  <!-- Footer -->
  <footer>
    <div class="footer-links">
      <a href="https://github.com/mxggle/Lingo-context" target="_blank" data-i18n="helpLink">Help</a>
      <a href="https://github.com/mxggle/Lingo-context/issues/new" target="_blank" data-i18n="feedbackLink">Feedback</a>
    </div>
    <span id="versionDisplay"></span>
  </footer>

  <!-- Toast notification -->
  <div class="toast" id="status"></div>

  <script type="module" src="popup.js"></script>
</body>

</html>
