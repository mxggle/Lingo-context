<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="title">Login Successful | LingoContext</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --bg: #0f172a;
            --text: #f8fafc;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bg);
            background-image:
                radial-gradient(circle at 0% 0%, rgba(99, 102, 241, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(79, 70, 229, 0.1) 0%, transparent 50%);
            font-family: 'Inter', sans-serif;
            color: var(--text);
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 3rem;
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            max-width: 420px;
            width: 90%;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .icon-wrapper {
            width: 80px;
            height: 80px;
            background: rgba(99, 102, 241, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem;
            position: relative;
        }

        .icon-wrapper::after {
            content: '';
            position: absolute;
            inset: -4px;
            border: 2px solid var(--primary);
            border-radius: 50%;
            opacity: 0.3;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
                opacity: 0.3;
            }

            50% {
                transform: scale(1.1);
                opacity: 0.1;
            }

            100% {
                transform: scale(1);
                opacity: 0.3;
            }
        }

        .checkmark {
            width: 40px;
            height: 40px;
            stroke: var(--primary);
            stroke-width: 4;
            stroke-linecap: round;
            stroke-linejoin: round;
            fill: none;
            stroke-dasharray: 60;
            stroke-dashoffset: 60;
            animation: draw 0.6s ease-out 0.4s forwards;
        }

        @keyframes draw {
            to {
                stroke-dashoffset: 0;
            }
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0 0 1rem;
            background: linear-gradient(to bottom right, #fff, #94a3b8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 1.5rem;
            font-size: 1.1rem;
        }

        .actions {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .dashboard-button {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 220px;
            padding: 0.95rem 1.4rem;
            border: 0;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            color: #fff;
            font-size: 1rem;
            font-weight: 700;
            text-decoration: none;
            cursor: pointer;
            box-shadow: 0 16px 30px -18px rgba(99, 102, 241, 0.8);
            transition: transform 0.18s ease, box-shadow 0.18s ease, opacity 0.18s ease;
        }

        .dashboard-button:hover {
            transform: translateY(-1px);
            box-shadow: 0 20px 36px -18px rgba(99, 102, 241, 0.9);
        }

        .dashboard-button:active {
            transform: translateY(0);
        }

        .status-text {
            margin: 0;
            font-size: 0.95rem;
            color: #cbd5e1;
        }

        .close-hint {
            font-size: 0.875rem;
            color: #64748b;
            padding: 0.75rem 1.5rem;
            background: rgba(15, 23, 42, 0.4);
            border-radius: 12px;
            display: inline-block;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
    </style>
</head>

<body>
    <!-- User data for extension to pick up — injected by server -->
    <div id="lingocontext-auth-data" data-user="__USER_DATA__"></div>

    <div class="container">
        <div class="icon-wrapper">
            <svg class="checkmark" viewBox="0 0 52 52">
                <path d="M14 27l7.5 7.5L38 18"></path>
            </svg>
        </div>
        <h1 data-i18n="heading">Welcome Back!</h1>
        <p data-i18n="body">Login successful. Opening your dashboard so you can start learning right away.</p>
        <div class="actions">
            <button id="lingocontext-open-dashboard" class="dashboard-button" type="button" data-i18n="cta">
                Go to Dashboard
            </button>
            <p id="lingocontext-dashboard-status" class="status-text" data-i18n="statusIdle">
                If nothing happens, use the button above.
            </p>
        </div>
        <div class="close-hint" data-i18n="closeHint">
            You can safely close this window now
        </div>
    </div>
    <script>
        const messages = {
            en: {
                title: 'Login Successful | LingoContext',
                heading: 'Welcome Back!',
                body: 'Login successful. Opening your dashboard so you can start learning right away.',
                cta: 'Go to Dashboard',
                statusIdle: 'If nothing happens, use the button above.',
                closeHint: 'You can safely close this window now'
            },
            ja: {
                title: 'ログイン成功 | LingoContext',
                heading: 'おかえりなさい！',
                body: 'ログインに成功しました。すぐに学習を始められるよう、ダッシュボードを開きます。',
                cta: 'ダッシュボードへ',
                statusIdle: '何も起こらない場合は、上のボタンを使ってください。',
                closeHint: 'このウィンドウは閉じても安全です'
            },
            zh_CN: {
                title: '登录成功 | LingoContext',
                heading: '欢迎回来！',
                body: '登录成功。正在打开你的仪表板，方便你马上开始学习。',
                cta: '前往仪表板',
                statusIdle: '如果没有反应，请使用上面的按钮。',
                closeHint: '你现在可以安全关闭此窗口'
            },
            zh_TW: {
                title: '登入成功 | LingoContext',
                heading: '歡迎回來！',
                body: '登入成功。正在開啟你的儀表板，讓你可以立刻開始學習。',
                cta: '前往儀表板',
                statusIdle: '如果沒有反應，請使用上方按鈕。',
                closeHint: '你現在可以安全地關閉此視窗'
            }
        };

        const normalizedLang = (() => {
            const lang = (navigator.language || 'en').toLowerCase();
            if (lang.startsWith('ja')) return 'ja';
            if (lang === 'zh-cn' || lang === 'zh-sg' || lang.startsWith('zh-hans')) return 'zh_CN';
            if (lang === 'zh-tw' || lang === 'zh-hk' || lang.startsWith('zh-hant')) return 'zh_TW';
            return 'en';
        })();

        const copy = messages[normalizedLang] || messages.en;
        document.querySelectorAll('[data-i18n]').forEach((el) => {
            const key = el.getAttribute('data-i18n');
            if (copy[key]) {
                el.textContent = copy[key];
            }
        });
        if (copy.title) {
            document.title = copy.title;
        }
    </script>
</body>

</html>
